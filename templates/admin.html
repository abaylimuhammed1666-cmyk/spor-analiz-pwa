<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Maç Yönetim Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00ffcc; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #bbb; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background: #00ffcc; color: #000; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; }
        button:hover { background: #00cca3; }
        .back { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Yeni Maç Ekle</h2>
        <form method="POST">
            <label>Lig Adı:</label>
            <input type="text" name="lig" placeholder="Örn: Trendyol Süper Lig" required>
            
            <label>Tarih:</label>
            <input type="text" name="tarih" placeholder="2026-10-20" required>
            
            <label>Saat:</label>
            <input type="text" name="saat" placeholder="20:00" required>
            
            <label>Maç (Ev Sahibi - Deplasman):</label>
            <input type="text" name="mac" placeholder="Galatasaray - Fenerbahçe" required>
            
            <label>Skor Tahmini:</label>
            <input type="text" name="skor_tahmini" placeholder="2 - 1" required>
            
            <label>İY 1.5 Üst (%):</label>
            <input type="text" name="iy_15_ust" placeholder="%60" required>
            
            <label>KG Var (%):</label>
            <input type="text" name="kg_var" placeholder="%55" required>
            
            <label>6 Gol Üst (%):</label>
            <input type="text" name="gol_6_ust" placeholder="%20" required>
            
            <button type="submit">Maçı Kaydet</button>
        </form>
        <a href="/" class="back">← Ana Sayfaya Dön</a>
    </div>
</body>
</html>
