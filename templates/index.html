<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Spor Analiz Bülteni</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #00ffcc; }
        .filter-container { text-align: center; margin-bottom: 20px; }
        select { padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .match-card { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; }
        .league-title { color: #00ffcc; margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    </style>
</head>
<body>
    <h1>Spor Analiz Bülteni</h1>
    
    <div class="filter-container">
        <form method="GET">
            <label>Lig Seç: </label>
            <select name="lig" onchange="this.form.submit()">
                {% for l in ligler %}
                    <option value="{{ l }}" {% if l == secilen_lig %}selected{% endif %}>{{ l }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    {% for lig, maclar in lig_gruplari.items() %}
        <h2 class="league-title">{{ lig }}</h2>
        {% for m in maclar %}
            <div class="match-card">
                <strong>{{ m.tarih }} - {{ m.saat }}</strong> | {{ m.mac }}<br>
                <small>Tahmin: {{ m.skor_tahmini }} | İY 1.5 Üst: {{ m.iy_1_5_ust }} | KG Var: {{ m.kg_var }} | 6 Gol Üst: {{ m.alt_ust_6_gol }}</small>
            </div>
        {% endfor %}
    {% endfor %}
</body>
</html>
